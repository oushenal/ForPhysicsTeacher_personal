<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>可拖拽电梯实验室 · 左右布局</title>
<style>
  :root{
    --bg:#0e1220;
    --panel:#171c30;
    --panel2:#1f2540;
    --line:#2a3355;
    --text:#e9edf9;
    --dim:#8b95b5;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:radial-gradient(1400px 700px at 50% -10%, #1a2240, #0e1220 60%);
    color:var(--text);
    min-height:100vh;
    padding:16px 12px 40px;
  }
  h1{
    text-align:center;
    font-size:clamp(17px,4vw,24px);
    margin:8px 0 4px;
    letter-spacing:1px;
  }
  .sub{
    text-align:center;
    color:var(--dim);
    font-size:13px;
    margin-bottom:16px;
  }
  .lab{
    max-width:1240px;
    margin:0 auto;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:16px;
    padding:12px;
  }
  canvas{
    display:block;
    width:100%;
    border-radius:12px;
    background:#080c16;
    touch-action:none;
  }
  .controls{
    display:flex;
    flex-wrap:wrap;
    gap:10px 18px;
    align-items:center;
    margin-top:12px;
    padding:12px 14px;
    background:var(--panel2);
    border:1px solid var(--line);
    border-radius:12px;
    font-size:13px;
  }
  .switch{
    display:inline-flex;
    align-items:center;
    gap:8px;
    cursor:pointer;
    user-select:none;
  }
  .switch input{display:none}
  .track{
    width:38px;height:22px;
    background:var(--line);
    border-radius:999px;
    position:relative;
    transition:.2s;
    flex-shrink:0;
  }
  .track::after{
    content:'';
    position:absolute;
    top:3px;left:3px;
    width:16px;height:16px;
    background:#fff;
    border-radius:50%;
    transition:.2s;
  }
  .switch input:checked + .track{
    background:linear-gradient(135deg,#2b5cff,#4ea1ff);
  }
  .switch input:checked + .track::after{left:19px}
  .btn{
    padding:7px 16px;
    border-radius:8px;
    border:1px solid var(--line);
    background:var(--panel);
    color:var(--text);
    font-size:13px;
    cursor:pointer;
    font-family:inherit;
    font-weight:600;
    transition:.18s;
  }
  .btn:hover{ background:var(--line); }
  #pauseBtn.paused{
    background:linear-gradient(135deg,#ff5d6c,#ff8a94);
    border-color:transparent;
    color:#fff;
  }
  .slider-row{
    display:none;
    align-items:center;
    gap:12px;
    margin-top:12px;
    padding:12px 18px;
    background:var(--panel2);
    border:1px solid var(--line);
    border-radius:12px;
  }
  .slider-row.active{display:flex}
  .slider-row label{
    font-size:13px;
    color:var(--dim);
    white-space:nowrap;
  }
  .slider-row input[type=range]{
    flex:1;
    accent-color:#4ea1ff;
    cursor:pointer;
    min-width:120px;
  }
  .slider-row .val{
    font-family:ui-monospace,monospace;
    font-size:14px;
    min-width:76px;
    text-align:right;
    color:var(--text);
  }
</style>
</head>
<body>

<h1>可拖拽电梯实验室</h1>
<p class="sub">拖动电梯、暂停回看，观察支持力与竖井楼层变化</p>

<div class="lab">
  <canvas id="cv"></canvas>
  <div class="controls">
    <button class="btn" id="pauseBtn">暂停</button>
    <label class="switch">
      <input type="checkbox" id="sliderModeToggle">
      <span class="track"></span>
      <span>滑块模式</span>
    </label>
    <label class="switch">
      <input type="checkbox" id="snapToggle" checked>
      <span class="track"></span>
      <span>吸附</span>
    </label>
    <button class="btn" id="resetBtn">回到中心</button>
  </div>
  <div class="slider-row" id="sliderRow">
    <label>加速度 a</label>
    <input type="range" id="slider" min="-10" max="10" step="0.1" value="0">
    <span class="val" id="sliderVal">0.0 m/s²</span>
  </div>
</div>

<script>
(function(){
  "use strict";

  /* =========================================================
     基础
     ========================================================= */
  var canvas = document.getElementById('cv');
  var ctx = canvas.getContext('2d');
  var W = 1200, H = 760;

  function resize(){
    var dpr = Math.min(1.5, window.devicePixelRatio || 1);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    canvas.style.aspectRatio = W + ' / ' + H;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);

  /* =========================================================
     常量
     ========================================================= */
  var g = 10;
  var m = 50;
  var mg = m * g;

  /* 左侧竖井 */
  var SHAFT_W = 295;
  var RIB_SPACING = 70;
  var MAJOR_EVERY = 3;
  var FLOOR_UNIT = RIB_SPACING * MAJOR_EVERY;
  var BASE_FLOOR = 5;

  var ELEV_X = 45;
  var ELEV_W = 200;
  var ELEV_H = 240;
  var ELEV_Y = 260;
  var ELEV_Y_CENTER = ELEV_Y + ELEV_H / 2;   // 380

  /* 右侧区域 */
  var RIGHT_X = 320;
  var RIGHT_W = 860;

  var PANEL_X = RIGHT_X;
  var PANEL_Y = 20;
  var PANEL_W = RIGHT_W;
  var PANEL_H = 200;

  var FT_X = RIGHT_X, FT_Y = 240, FT_W = RIGHT_W, FT_H = 150;
  var AT_X = RIGHT_X, AT_Y = 410, AT_W = RIGHT_W, AT_H = 150;

  /* 时间轴 */
  var TL_X = RIGHT_X;
  var TL_Y = 585;
  var TL_W = RIGHT_W;
  var TL_H = 40;

  /* =========================================================
     状态
     ========================================================= */
  var buildingScroll = 0;
  var buildingScrollTarget = 0;
  var scrollV = 0;
  var scrollAccelSmoothed = 0;
  var physicalA = 0;
  var currentN = mg;

  var dragging = false;
  var dragStartY = 0;
  var dragStartScroll = 0;

  var sliderMode = false;
  var sliderA = 0;
  var snapEnabled = true;
  var snapRefA = null;

  var paused = false;
  var scrubTime = null;
  var draggingTimeline = false;

  var history = [];
  var HISTORY_DURATION = 6;
  var HISTORY_MAX = 600;

  /* =========================================================
     工具
     ========================================================= */
  function clamp(v, a, b){
    return v < a ? a : (v > b ? b : v);
  }

  function hexA(hex, a){
    var r = parseInt(hex.slice(1,3), 16);
    var gg = parseInt(hex.slice(3,5), 16);
    var b = parseInt(hex.slice(5,7), 16);
    return 'rgba(' + r + ',' + gg + ',' + b + ',' + a + ')';
  }

  function rr(x, y, w, h, r){
    if(w < 0){ x += w; w = -w; }
    if(h < 0){ y += h; h = -h; }
    if(typeof r !== 'number' || r < 0) r = 0;
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  function drawArrow(x1, y1, x2, y2, color, width, headLen){
    var dx = x2 - x1, dy = y2 - y1;
    var len = Math.sqrt(dx*dx + dy*dy);
    if(len < 3) return;
    var ux = dx / len, uy = dy / len;
    var bx = x2 - ux * headLen;
    var by = y2 - uy * headLen;
    var px = -uy, py = ux;
    var hw = headLen * 0.5;

    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.lineWidth = width;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(bx, by);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(x2, y2);
    ctx.lineTo(bx + px * hw, by + py * hw);
    ctx.lineTo(bx - px * hw, by - py * hw);
    ctx.closePath();
    ctx.fill();
  }

  function getCanvasPos(e){
    var rect = canvas.getBoundingClientRect();
    return {
      x: (e.clientX - rect.left) * (W / rect.width),
      y: (e.clientY - rect.top) * (H / rect.height)
    };
  }

  function isInElevator(x, y){
    return x >= ELEV_X - 15 && x <= ELEV_X + ELEV_W + 15 &&
           y >= ELEV_Y - 15 && y <= ELEV_Y + ELEV_H + 15;
  }

  function isInTimeline(x, y){
    return x >= TL_X - 10 && x <= TL_X + TL_W + 10 &&
           y >= TL_Y - 20 && y <= TL_Y + TL_H + 10;
  }

  /* =========================================================
     物理
     ========================================================= */
  var KP = 10;
  var SCROLL_V_MAX = 1800;
  var SCROLL_A_MAX = 7000;
  var ACC_SCALE = 0.001;
  var SLIDER_SCROLL_ACCEL = 25;

  function updatePhysics(dt){
    if(sliderMode){
      physicalA += (sliderA - physicalA) * Math.min(1, dt * 10);
      scrollV += physicalA * SLIDER_SCROLL_ACCEL * dt;
      buildingScroll += scrollV * dt;
      buildingScrollTarget = buildingScroll;
      currentN = Math.max(0, m * (g + physicalA));
      return;
    }

    var diff = buildingScrollTarget - buildingScroll;
    var desiredV = clamp(diff * KP, -SCROLL_V_MAX, SCROLL_V_MAX);
    var dv = clamp(desiredV - scrollV, -SCROLL_A_MAX * dt, SCROLL_A_MAX * dt);
    var prevV = scrollV;
    scrollV += dv;
    buildingScroll += scrollV * dt;

    var scrollAccel = (scrollV - prevV) / Math.max(dt, 0.001);
    scrollAccelSmoothed += (scrollAccel - scrollAccelSmoothed) * Math.min(1, dt * 25);

    var a = scrollAccelSmoothed * ACC_SCALE;
    a = clamp(a, -g, g);
    if(Math.abs(a) < 0.25) a = 0;

    if(snapEnabled && dragging){
      if(snapRefA === null && Math.abs(a) > 1.0){
        snapRefA = a;
      }
      if(snapRefA !== null){
        var d = snapRefA - a;
        if(Math.abs(d) < 2.0){
          a = a + d * Math.min(1, dt * 12);
        }
      }
    }

    physicalA = a;
    currentN = Math.max(0, m * (g + physicalA));
  }

  /* =========================================================
     历史与显示状态
     ========================================================= */
  function pushHistory(){
    var t = performance.now() / 1000;
    history.push({ t: t, N: currentN, a: physicalA, scroll: buildingScroll });
    if(history.length > HISTORY_MAX) history.shift();
    var cutoff = t - HISTORY_DURATION;
    while(history.length && history[0].t < cutoff) history.shift();
  }

  function getDisplayState(){
    if(paused && scrubTime !== null && history.length > 0){
      var best = history[0];
      var bestDist = Math.abs(history[0].t - scrubTime);
      for(var i = 1; i < history.length; i++){
        var d = Math.abs(history[i].t - scrubTime);
        if(d < bestDist){ bestDist = d; best = history[i]; }
      }
      return { N: best.N, a: best.a, scroll: best.scroll };
    }
    return { N: currentN, a: physicalA, scroll: buildingScroll };
  }

  /* =========================================================
     竖井背景
     ========================================================= */
  function drawShaft(scroll){
    var grad = ctx.createLinearGradient(0, 0, SHAFT_W, 0);
    grad.addColorStop(0, '#060a14');
    grad.addColorStop(0.5, '#0e1424');
    grad.addColorStop(1, '#060a14');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, SHAFT_W, H);

    ctx.strokeStyle = 'rgba(70, 90, 150, 0.55)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(5, 0); ctx.lineTo(5, H);
    ctx.moveTo(SHAFT_W - 5, 0); ctx.lineTo(SHAFT_W - 5, H);
    ctx.stroke();

    ctx.strokeStyle = 'rgba(78, 161, 255, 0.08)';
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.moveTo(8, 0); ctx.lineTo(8, H);
    ctx.moveTo(SHAFT_W - 8, 0); ctx.lineTo(SHAFT_W - 8, H);
    ctx.stroke();

    var iMin = Math.floor((scroll + ELEV_Y_CENTER - H) / RIB_SPACING) - 1;
    var iMax = Math.ceil((scroll + ELEV_Y_CENTER) / RIB_SPACING) + 1;
    if(iMax - iMin > 80) iMax = iMin + 80;

    var currentFloor = BASE_FLOOR + Math.round(scroll / FLOOR_UNIT);
    var speed = paused ? 0 : Math.abs(scrollV);

    for(var i = iMin; i <= iMax; i++){
      var y = ELEV_Y_CENTER + scroll - i * RIB_SPACING;
      if(y < -80 || y > H + 80) continue;

      var isMajor = (i % MAJOR_EVERY === 0);

      if(isMajor){
        var floorN = BASE_FLOOR + Math.round(i / MAJOR_EVERY);
        var isCurrent = (floorN === currentFloor);

        if(speed > 300){
          var trailAlpha = Math.min(0.35, speed / 6000);
          ctx.strokeStyle = 'rgba(100, 140, 220, ' + trailAlpha + ')';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(16, y + scrollV * 0.012);
          ctx.lineTo(SHAFT_W - 16, y + scrollV * 0.012);
          ctx.stroke();
        }

        if(isCurrent){
          ctx.strokeStyle = 'rgba(78, 161, 255, 0.95)';
          ctx.lineWidth = 5;
          ctx.shadowColor = 'rgba(78, 161, 255, 0.6)';
          ctx.shadowBlur = 12;
        } else {
          ctx.strokeStyle = 'rgba(110, 130, 190, 0.85)';
          ctx.lineWidth = 3.5;
          ctx.shadowBlur = 0;
        }
        ctx.beginPath();
        ctx.moveTo(14, y);
        ctx.lineTo(SHAFT_W - 14, y);
        ctx.stroke();
        ctx.shadowBlur = 0;

        ctx.textAlign = 'right';
        ctx.textBaseline = 'middle';
        if(isCurrent){
          ctx.fillStyle = 'rgba(78, 161, 255, 1)';
          ctx.font = '700 30px ui-monospace, monospace';
          ctx.shadowColor = 'rgba(78, 161, 255, 0.8)';
          ctx.shadowBlur = 10;
        } else {
          ctx.fillStyle = 'rgba(190, 205, 235, 0.92)';
          ctx.font = '600 25px ui-monospace, monospace';
        }
        ctx.fillText(floorN + 'F', SHAFT_W - 20, y - 24);
        ctx.shadowBlur = 0;
      } else {
        ctx.strokeStyle = 'rgba(60, 78, 125, 0.65)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(22, y);
        ctx.lineTo(SHAFT_W - 22, y);
        ctx.stroke();
      }
    }

    var vg = ctx.createLinearGradient(0, 0, 0, H);
    vg.addColorStop(0, 'rgba(5, 8, 16, 0.6)');
    vg.addColorStop(0.15, 'rgba(5, 8, 16, 0)');
    vg.addColorStop(0.85, 'rgba(5, 8, 16, 0)');
    vg.addColorStop(1, 'rgba(5, 8, 16, 0.6)');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, SHAFT_W, H);
  }

  /* =========================================================
     主绘制
     ========================================================= */
  function draw(){
    ctx.fillStyle = '#080c16';
    ctx.fillRect(0, 0, W, H);

    var ds = getDisplayState();
    var ratio = ds.N / mg;

    var state, stateColor;
    if(Math.abs(ds.a) < 0.3){
      state = '静止 / 匀速';
      stateColor = '#8b95b5';
    } else if(ratio > 1.02){
      state = '超重';
      stateColor = '#ff5d6c';
    } else if(ratio > 0.05){
      state = '失重';
      stateColor = '#4ea1ff';
    } else {
      state = '完全失重';
      stateColor = '#b47cff';
    }

    try{ drawShaft(ds.scroll); }catch(e){ console.warn('shaft', e); }

    if(Math.abs(ds.a) > 0.3){
      try{
        var glow = ctx.createRadialGradient(150, 380, 30, 150, 380, 400);
        glow.addColorStop(0, hexA(stateColor, 0.18));
        glow.addColorStop(1, hexA(stateColor, 0));
        ctx.fillStyle = glow;
        ctx.fillRect(0, 100, 440, 660);
      }catch(e){}
    }

    try{ drawElevator(stateColor, ratio, ds); }catch(e){ console.warn('elev', e); }
    try{ drawPanel(stateColor, ratio, state, ds); }catch(e){ console.warn('panel', e); }
    try{ drawFTChart(ds); }catch(e){ console.warn('ft', e); }
    try{ drawATChart(ds); }catch(e){ console.warn('at', e); }
    try{ drawTimeline(); }catch(e){ console.warn('tl', e); }
  }

  /* ---------- 电梯 ---------- */
  function drawElevator(stateColor, ratio, ds){
    var cx = ELEV_X + ELEV_W / 2;

    ctx.strokeStyle = '#3a4468';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(cx, 0);
    ctx.lineTo(cx, ELEV_Y + 5);
    ctx.stroke();

    ctx.fillStyle = '#0d1220';
    rr(ELEV_X + 4, ELEV_Y + 4, ELEV_W - 8, ELEV_H - 8, 12);
    ctx.fill();

    if(ratio < 0.15 && Math.abs(ds.a) > 0.5){
      var intensity = 1 - ratio / 0.15;
      var t = performance.now() / 1000;
      for(var i = 0; i < 30; i++){
        var rx = (i * 137.5) % 100 / 100;
        var ry = (i * 73.3) % 100 / 100;
        var sx = ELEV_X + 20 + rx * (ELEV_W - 40);
        var sy = ELEV_Y + 30 + ry * (ELEV_H - 60);
        var alpha = intensity * (0.3 + 0.7 * (0.5 + 0.5 * Math.sin(t * 3 + i)));
        ctx.globalAlpha = alpha;
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(sx, sy, 1 + (i % 3) * 0.7, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    var headY = ELEV_Y + 40;
    var shoulderY = ELEV_Y + 75;
    var hipY = ELEV_Y + 140;
    var feetY = ELEV_Y + 210;

    ctx.strokeStyle = '#e9edf9';
    ctx.lineWidth = 3.5;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    ctx.beginPath();
    ctx.arc(cx, headY, 18, 0, Math.PI * 2);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(cx, headY + 18);
    ctx.lineTo(cx, hipY);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(cx, shoulderY);
    ctx.lineTo(cx - 22, shoulderY + 32);
    ctx.moveTo(cx, shoulderY);
    ctx.lineTo(cx + 22, shoulderY + 32);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(cx, hipY);
    ctx.lineTo(cx - 16, feetY);
    ctx.moveTo(cx, hipY);
    ctx.lineTo(cx + 16, feetY);
    ctx.stroke();

    ctx.fillStyle = '#1f2540';
    ctx.strokeStyle = '#2a3355';
    ctx.lineWidth = 1.5;
    rr(ELEV_X + 16, ELEV_Y + 210, ELEV_W - 32, 28, 8);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = stateColor;
    ctx.font = '700 14px ui-monospace, monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(ds.N.toFixed(0) + ' N', cx, ELEV_Y + 224);

    drawArrow(cx - 45, ELEV_Y + 110, cx - 45, ELEV_Y + 180, '#4ea1ff', 3.5, 10);
    ctx.fillStyle = '#4ea1ff';
    ctx.font = '700 13px -apple-system, sans-serif';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    ctx.fillText('mg', cx - 52, ELEV_Y + 145);

    var nLen = Math.min(80, 60 * ratio);
    if(nLen > 5){
      drawArrow(cx + 45, ELEV_Y + 208, cx + 45, ELEV_Y + 208 - nLen, '#ff5d6c', 3.5, 10);
      ctx.fillStyle = '#ff5d6c';
      ctx.font = '700 13px -apple-system, sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText('N', cx + 52, ELEV_Y + 208 - nLen / 2);
    }

    ctx.strokeStyle = dragging ? '#4ea1ff' : 'rgba(80, 100, 160, 0.85)';
    ctx.lineWidth = 2.5;
    if(dragging){
      ctx.shadowColor = 'rgba(78, 161, 255, 0.6)';
      ctx.shadowBlur = 10;
    }
    rr(ELEV_X, ELEV_Y, ELEV_W, ELEV_H, 14);
    ctx.stroke();
    ctx.shadowBlur = 0;

    if(!dragging && !sliderMode && !paused){
      var tt = performance.now() / 1000;
      var pulse = 0.35 + 0.25 * Math.sin(tt * 3);
      ctx.fillStyle = hexA('#4ea1ff', pulse);
      ctx.beginPath();
      ctx.moveTo(cx - 12, ELEV_Y - 20);
      ctx.lineTo(cx + 12, ELEV_Y - 20);
      ctx.lineTo(cx, ELEV_Y - 10);
      ctx.closePath();
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(cx - 12, ELEV_Y + ELEV_H + 20);
      ctx.lineTo(cx + 12, ELEV_Y + ELEV_H + 20);
      ctx.lineTo(cx, ELEV_Y + ELEV_H + 10);
      ctx.closePath();
      ctx.fill();
    }

    if(paused){
      ctx.fillStyle = 'rgba(255, 93, 108, 0.9)';
      ctx.font = '700 11px -apple-system, sans-serif';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'top';
      ctx.fillText('■ 已暂停', 12, 12);
    }
  }

  /* ---------- 实时数据面板（横向布局） ---------- */
  function drawPanel(stateColor, ratio, state, ds){
    var PX = PANEL_X, PY = PANEL_Y, PW = PANEL_W, PH = PANEL_H;

    ctx.fillStyle = '#171c30';
    ctx.strokeStyle = '#2a3355';
    ctx.lineWidth = 1;
    rr(PX, PY, PW, PH, 14);
    ctx.fill();
    ctx.stroke();

    /* 列 1：N 数字（x 340~620） */
    ctx.fillStyle = '#8b95b5';
    ctx.font = '500 13px -apple-system, sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillText('实时数据', PX + 24, PY + 32);

    ctx.fillStyle = '#e9edf9';
    ctx.font = '700 52px ui-monospace, monospace';
    ctx.textAlign = 'center';
    ctx.fillText(ds.N.toFixed(0), PX + 170, PY + 110);

    ctx.fillStyle = '#8b95b5';
    ctx.font = '400 13px -apple-system, sans-serif';
    ctx.fillText('支持力 N（牛顿）', PX + 170, PY + 140);

    /* 列 2：比值 + 条形图（x 640~920 中心 780） */
    var midX = PX + 460;

    ctx.fillStyle = '#8b95b5';
    ctx.font = '400 14px ui-monospace, monospace';
    ctx.textAlign = 'center';
    ctx.fillText('N / mg = ' + ratio.toFixed(2), midX, PY + 58);

    var barX = midX - 130, barY = PY + 80, barW = 260, barH = 26;
    ctx.fillStyle = '#1f2540';
    ctx.strokeStyle = '#2a3355';
    ctx.lineWidth = 1.5;
    rr(barX, barY, barW, barH, 8);
    ctx.fill();
    ctx.stroke();

    var fillRatio = clamp(ratio / 2, 0, 1);
    if(fillRatio > 0.02){
      ctx.fillStyle = stateColor;
      rr(barX, barY, barW * fillRatio, barH, 8);
      ctx.fill();
    }

    var centerX = barX + barW / 2;
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.moveTo(centerX, barY - 5);
    ctx.lineTo(centerX, barY + barH + 5);
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.fillStyle = '#8b95b5';
    ctx.font = '400 11px ui-monospace, monospace';
    ctx.textAlign = 'center';
    ctx.fillText('0', barX + 6, barY + barH + 18);
    ctx.fillText('mg', centerX, barY + barH + 18);
    ctx.fillText('2mg', barX + barW - 6, barY + barH + 18);

    /* 列 3：状态 + a 值（x 940~1160 中心 1050） */
    var rightX = PX + 730;

    ctx.fillStyle = stateColor;
    ctx.font = '700 34px -apple-system, "PingFang SC", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(state, rightX, PY + 80);

    ctx.fillStyle = '#8b95b5';
    ctx.font = '400 14px ui-monospace, monospace';
    var sign = ds.a >= 0 ? '+' : '';
    ctx.fillText('a = ' + sign + ds.a.toFixed(1) + ' m/s²', rightX, PY + 120);

    if(snapEnabled && dragging && snapRefA !== null && !paused){
      ctx.fillStyle = '#3ddc84';
      ctx.font = '500 12px -apple-system, sans-serif';
      ctx.fillText('吸附中 → ' + (snapRefA >= 0 ? '+' : '') + snapRefA.toFixed(1) + ' m/s²', rightX, PY + 155);
    }
  }

  /* ---------- F-t 图 ---------- */
  function drawFTChart(ds){
    var x = FT_X, y = FT_Y, w = FT_W, h = FT_H;
    var yMax = 2 * mg;

    ctx.fillStyle = '#0d1220';
    ctx.strokeStyle = '#2a3355';
    ctx.lineWidth = 1;
    rr(x, y, w, h, 10);
    ctx.fill();
    ctx.stroke();

    ctx.strokeStyle = '#1a2030';
    ctx.lineWidth = 1;
    for(var i = 1; i < 4; i++){
      var gy = y + h * (i / 4);
      ctx.beginPath();
      ctx.moveTo(x, gy);
      ctx.lineTo(x + w, gy);
      ctx.stroke();
    }

    var mgY = y + h * (1 - mg / yMax);
    ctx.strokeStyle = 'rgba(139,149,181,0.55)';
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.moveTo(x, mgY);
    ctx.lineTo(x + w, mgY);
    ctx.stroke();
    ctx.setLineDash([]);

    var now;
    if(paused && history.length > 0){
      now = history[history.length - 1].t;
    } else {
      now = performance.now() / 1000;
    }
    var tMin = now - HISTORY_DURATION;

    if(history.length >= 2){
      ctx.strokeStyle = 'rgba(255,93,108,0.25)';
      ctx.lineWidth = 6;
      ctx.lineJoin = 'round';
      ctx.beginPath();
      var started = false;
      for(var hi = 0; hi < history.length; hi++){
        var p = history[hi];
        var px = x + ((p.t - tMin) / HISTORY_DURATION) * w;
        var py = y + h * (1 - p.N / yMax);
        if(!started){ ctx.moveTo(px, py); started = true; }
        else ctx.lineTo(px, py);
      }
      ctx.stroke();

      ctx.strokeStyle = '#ff5d6c';
      ctx.lineWidth = 2;
      ctx.beginPath();
      started = false;
      for(var hj = 0; hj < history.length; hj++){
        var p2 = history[hj];
        var px2 = x + ((p2.t - tMin) / HISTORY_DURATION) * w;
        var py2 = y + h * (1 - p2.N / yMax);
        if(!started){ ctx.moveTo(px2, py2); started = true; }
        else ctx.lineTo(px2, py2);
      }
      ctx.stroke();

      if(paused && scrubTime !== null){
        var rx = x + ((scrubTime - tMin) / HISTORY_DURATION) * w;
        if(rx >= x && rx <= x + w){
          ctx.strokeStyle = 'rgba(78, 161, 255, 0.85)';
          ctx.lineWidth = 1.5;
          ctx.setLineDash([3, 3]);
          ctx.beginPath();
          ctx.moveTo(rx, y);
          ctx.lineTo(rx, y + h);
          ctx.stroke();
          ctx.setLineDash([]);
        }
      }

      var lN = ds.N;
      var lT = paused ? scrubTime : history[history.length - 1].t;
      if(paused && scrubTime !== null){
        var bestN = history[0].N;
        var bestD = Math.abs(history[0].t - scrubTime);
        for(var bi = 1; bi < history.length; bi++){
          var bd = Math.abs(history[bi].t - scrubTime);
          if(bd < bestD){ bestD = bd; bestN = history[bi].N; }
        }
        lN = bestN;
      }
      var cx2 = x + ((lT - tMin) / HISTORY_DURATION) * w;
      var cy2 = y + h * (1 - lN / yMax);
      if(cx2 >= x && cx2 <= x + w){
        ctx.fillStyle = '#ff5d6c';
        ctx.beginPath();
        ctx.arc(cx2, cy2, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(cx2, cy2, 1.8, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    ctx.fillStyle = '#ff5d6c';
    ctx.font = '700 12px -apple-system, sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.fillText('F-t  支持力 N', x + 12, y + 7);

    ctx.fillStyle = '#8b95b5';
    ctx.font = '400 10px ui-monospace, monospace';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    ctx.fillText('2mg', x - 4, y + 2);
    ctx.fillText('mg', x - 4, mgY);
    ctx.fillText('0', x - 4, y + h - 2);

    ctx.fillStyle = '#e9edf9';
    ctx.font = '700 13px ui-monospace, monospace';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'top';
    ctx.fillText(ds.N.toFixed(0) + ' N', x + w - 12, y + 7);
  }

  /* ---------- a-t 图 ---------- */
  function drawATChart(ds){
    var x = AT_X, y = AT_Y, w = AT_W, h = AT_H;
    var aMax = g;

    ctx.fillStyle = '#0d1220';
    ctx.strokeStyle = '#2a3355';
    ctx.lineWidth = 1;
    rr(x, y, w, h, 10);
    ctx.fill();
    ctx.stroke();

    ctx.strokeStyle = '#1a2030';
    ctx.lineWidth = 1;
    for(var i = 1; i < 4; i++){
      var gy = y + h * (i / 4);
      ctx.beginPath();
      ctx.moveTo(x, gy);
      ctx.lineTo(x + w, gy);
      ctx.stroke();
    }

    var zeroY = y + h / 2;
    ctx.strokeStyle = 'rgba(139,149,181,0.55)';
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.moveTo(x, zeroY);
    ctx.lineTo(x + w, zeroY);
    ctx.stroke();
    ctx.setLineDash([]);

    var now;
    if(paused && history.length > 0){
      now = history[history.length - 1].t;
    } else {
      now = performance.now() / 1000;
    }
    var tMin = now - HISTORY_DURATION;

    if(history.length >= 2){
      ctx.strokeStyle = 'rgba(180,124,255,0.25)';
      ctx.lineWidth = 6;
      ctx.lineJoin = 'round';
      ctx.beginPath();
      var started = false;
      for(var hi = 0; hi < history.length; hi++){
        var p = history[hi];
        var px = x + ((p.t - tMin) / HISTORY_DURATION) * w;
        var py = zeroY - (p.a / aMax) * (h / 2);
        if(!started){ ctx.moveTo(px, py); started = true; }
        else ctx.lineTo(px, py);
      }
      ctx.stroke();

      ctx.strokeStyle = '#b47cff';
      ctx.lineWidth = 2;
      ctx.beginPath();
      started = false;
      for(var hj = 0; hj < history.length; hj++){
        var p2 = history[hj];
        var px2 = x + ((p2.t - tMin) / HISTORY_DURATION) * w;
        var py2 = zeroY - (p2.a / aMax) * (h / 2);
        if(!started){ ctx.moveTo(px2, py2); started = true; }
        else ctx.lineTo(px2, py2);
      }
      ctx.stroke();

      if(paused && scrubTime !== null){
        var rx2 = x + ((scrubTime - tMin) / HISTORY_DURATION) * w;
        if(rx2 >= x && rx2 <= x + w){
          ctx.strokeStyle = 'rgba(78, 161, 255, 0.85)';
          ctx.lineWidth = 1.5;
          ctx.setLineDash([3, 3]);
          ctx.beginPath();
          ctx.moveTo(rx2, y);
          ctx.lineTo(rx2, y + h);
          ctx.stroke();
          ctx.setLineDash([]);
        }
      }

      var lA = ds.a;
      var lT = paused ? scrubTime : history[history.length - 1].t;
      if(paused && scrubTime !== null){
        var bestA = history[0].a;
        var bestD = Math.abs(history[0].t - scrubTime);
        for(var bi = 1; bi < history.length; bi++){
          var bd = Math.abs(history[bi].t - scrubTime);
          if(bd < bestD){ bestD = bd; bestA = history[bi].a; }
        }
        lA = bestA;
      }
      var cx2 = x + ((lT - tMin) / HISTORY_DURATION) * w;
      var cy2 = zeroY - (lA / aMax) * (h / 2);
      if(cx2 >= x && cx2 <= x + w){
        ctx.fillStyle = '#b47cff';
        ctx.beginPath();
        ctx.arc(cx2, cy2, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(cx2, cy2, 1.8, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    ctx.fillStyle = '#b47cff';
    ctx.font = '700 12px -apple-system, sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.fillText('a-t  加速度 a', x + 12, y + 7);

    ctx.fillStyle = '#8b95b5';
    ctx.font = '400 10px ui-monospace, monospace';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    ctx.fillText('+' + g, x - 4, y + 2);
    ctx.fillText('0', x - 4, zeroY);
    ctx.fillText('-' + g, x - 4, y + h - 2);

    ctx.fillStyle = '#e9edf9';
    ctx.font = '700 13px ui-monospace, monospace';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'top';
    var sign = ds.a >= 0 ? '+' : '';
    ctx.fillText(sign + ds.a.toFixed(1) + ' m/s²', x + w - 12, y + 7);
  }

  /* ---------- 时间轴 ---------- */
  function drawTimeline(){
    var x = TL_X, y = TL_Y, w = TL_W, h = TL_H;

    ctx.fillStyle = '#0d1220';
    ctx.strokeStyle = '#2a3355';
    ctx.lineWidth = 1;
    rr(x, y, w, h, 10);
    ctx.fill();
    ctx.stroke();

    if(!paused || history.length < 2){
      ctx.fillStyle = '#8b95b5';
      ctx.font = '500 12px -apple-system, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('点击「暂停」后可拖动回看', x + w / 2, y + h / 2);
      return;
    }

    var tMin = history[0].t;
    var tMax = history[history.length - 1].t;
    var span = tMax - tMin;
    if(span < 0.01) return;

    var hx = x + clamp((scrubTime - tMin) / span, 0, 1) * w;

    ctx.fillStyle = '#1f2540';
    rr(x + 6, y + h / 2 - 5, w - 12, 10, 5);
    ctx.fill();

    ctx.fillStyle = 'rgba(78, 161, 255, 0.55)';
    rr(x + 6, y + h / 2 - 5, Math.max(0, hx - x - 6), 10, 5);
    ctx.fill();

    ctx.fillStyle = '#4ea1ff';
    ctx.beginPath();
    ctx.arc(hx, y + h / 2, 12, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.stroke();

    if(Math.abs(scrubTime - tMax) > 0.05){
      ctx.fillStyle = '#4ea1ff';
      ctx.font = '700 12px -apple-system, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'bottom';
      ctx.fillText('回看 -' + (tMax - scrubTime).toFixed(1) + 's', hx, y - 4);
    } else {
      ctx.fillStyle = '#3ddc84';
      ctx.font = '700 12px -apple-system, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'bottom';
      ctx.fillText('实时', hx, y - 4);
    }

    ctx.fillStyle = '#8b95b5';
    ctx.font = '400 11px ui-monospace, monospace';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.fillText('-' + span.toFixed(1) + 's', x, y + h + 4);
    ctx.textAlign = 'right';
    ctx.fillText('现在', x + w, y + h + 4);
  }

  /* =========================================================
     交互
     ========================================================= */
  function updateScrubFromPos(px){
    if(history.length < 2) return;
    var tMin = history[0].t;
    var tMax = history[history.length - 1].t;
    var ratio = clamp((px - TL_X) / TL_W, 0, 1);
    scrubTime = tMin + ratio * (tMax - tMin);
  }

  canvas.addEventListener('pointerdown', function(e){
    var pos = getCanvasPos(e);

    if(paused && isInTimeline(pos.x, pos.y)){
      draggingTimeline = true;
      updateScrubFromPos(pos.x);
      try{ canvas.setPointerCapture(e.pointerId); }catch(err){}
      e.preventDefault();
      return;
    }

    if(!paused && !sliderMode && isInElevator(pos.x, pos.y)){
      dragging = true;
      dragStartY = pos.y;
      dragStartScroll = buildingScrollTarget;
      snapRefA = null;
      try{ canvas.setPointerCapture(e.pointerId); }catch(err){}
      canvas.style.cursor = 'grabbing';
      e.preventDefault();
    }
  });

  canvas.addEventListener('pointermove', function(e){
    var pos = getCanvasPos(e);

    if(draggingTimeline){
      updateScrubFromPos(pos.x);
      e.preventDefault();
      return;
    }

    if(dragging){
      var deltaY = dragStartY - pos.y;
      buildingScrollTarget = dragStartScroll + deltaY;
      e.preventDefault();
      return;
    }

    if(paused){
      canvas.style.cursor = isInTimeline(pos.x, pos.y) ? 'pointer' : 'default';
    } else if(!sliderMode){
      canvas.style.cursor = isInElevator(pos.x, pos.y) ? 'grab' : 'default';
    }
  });

  canvas.addEventListener('pointerup', function(){
    dragging = false;
    draggingTimeline = false;
    snapRefA = null;
    canvas.style.cursor = 'grab';
  });

  canvas.addEventListener('pointercancel', function(){
    dragging = false;
    draggingTimeline = false;
    snapRefA = null;
    canvas.style.cursor = 'grab';
  });

  var pauseBtn = document.getElementById('pauseBtn');
  pauseBtn.addEventListener('click', function(){
    paused = !paused;
    if(paused){
      pauseBtn.textContent = '继续';
      pauseBtn.classList.add('paused');
      dragging = false;
      if(history.length > 0){
        scrubTime = history[history.length - 1].t;
      } else {
        scrubTime = performance.now() / 1000;
      }
    } else {
      pauseBtn.textContent = '暂停';
      pauseBtn.classList.remove('paused');
      scrubTime = null;
      lastTime = performance.now();
      buildingScrollTarget = buildingScroll;
      scrollV = 0;
      scrollAccelSmoothed = 0;
      snapRefA = null;
    }
  });

  var sliderRow = document.getElementById('sliderRow');
  var sliderInput = document.getElementById('slider');
  var sliderVal = document.getElementById('sliderVal');

  document.getElementById('sliderModeToggle').addEventListener('change', function(e){
    sliderMode = e.target.checked;
    if(sliderMode){
      sliderRow.classList.add('active');
      sliderA = physicalA;
      sliderInput.value = sliderA;
      sliderVal.textContent = sliderA.toFixed(1) + ' m/s²';
      dragging = false;
      snapRefA = null;
    } else {
      sliderRow.classList.remove('active');
      buildingScrollTarget = buildingScroll;
      scrollV = 0;
      snapRefA = null;
    }
  });

  sliderInput.addEventListener('input', function(e){
    sliderA = parseFloat(e.target.value);
    sliderVal.textContent = sliderA.toFixed(1) + ' m/s²';
  });

  document.getElementById('snapToggle').addEventListener('change', function(e){
    snapEnabled = e.target.checked;
    if(!snapEnabled) snapRefA = null;
  });

  document.getElementById('resetBtn').addEventListener('click', function(){
    paused = false;
    pauseBtn.textContent = '暂停';
    pauseBtn.classList.remove('paused');
    scrubTime = null;
    buildingScrollTarget = 0;
    buildingScroll = 0;
    scrollV = 0;
    scrollAccelSmoothed = 0;
    history = [];
    sliderA = 0;
    sliderInput.value = 0;
    sliderVal.textContent = '0.0 m/s²';
    snapRefA = null;
  });

  /* =========================================================
     主循环
     ========================================================= */
  var lastTime = performance.now();

  function loop(now){
    var dt = Math.min(0.05, (now - lastTime) / 1000);
    lastTime = now;

    if(!paused){
      try{
        updatePhysics(dt);
        pushHistory();
      }catch(err){ console.warn('loop err', err); }
    }

    try{ draw(); }catch(err){ console.warn('draw err', err); }

    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

})();
</script>
</body>
